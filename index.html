<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自分専用のAIメモアプリ</title>
</head>

<body>

  <h1>自分専用のAIメモアプリ</h1>

  <p>今日のメモ</p>

  <textarea
    id="memo"
    rows="10"
    cols="40"
    placeholder="ここにメモを入力してください"
  ></textarea>

  <br><br>

  <button onclick="saveMemo()">メモを保存</button>

  <p id="message"></p>
<h2>保存したメモ</h2>
<div id="savedMemo"></div>
<script>
function saveMemo() {
    const memo = document.getElementById("memo").value;

    if (memo.trim() === "") {
        document.getElementById("message").textContent =
            "メモを入力してください。";
        return;
    }

    let memos = JSON.parse(localStorage.getItem("memos") || "[]");

    memos.push(memo);

    localStorage.setItem("memos", JSON.stringify(memos));

    document.getElementById("message").textContent =
        "メモを保存しました。";

    displayMemos();
}

function displayMemos() {
    const savedMemo = document.getElementById("savedMemo");

    let memos = JSON.parse(localStorage.getItem("memos") || "[]");

    savedMemo.innerHTML = "";

    memos.forEach(function(memo, index) {
    const div = document.createElement("div");

    const p = document.createElement("p");
    p.textContent = memo;

    const editButton = document.createElement("button");
    editButton.textContent = "編集";

    editButton.onclick = function() {
        const newMemo = prompt("メモを編集してください", memo);

        if (newMemo !== null && newMemo.trim() !== "") {
            memos[index] = newMemo;
            localStorage.setItem("memos", JSON.stringify(memos));
            displayMemos();
        }
    };

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "削除";

    deleteButton.onclick = function() {
        memos.splice(index, 1);
        localStorage.setItem("memos", JSON.stringify(memos));
        displayMemos();
    };

    div.appendChild(p);
    div.appendChild(editButton);
    div.appendChild(deleteButton);

    savedMemo.appendChild(div);
});
}

window.onload = function() {
    displayMemos();
};
</script>

</body>
</html>
